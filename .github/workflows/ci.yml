name: Validate distribution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test successful and rejected inputs
        run: python3 -m unittest discover -s tests -v
      - name: Compare generated packages with pinned public upstream
        run: python3 scripts/sync.py --check
      - name: Check whitespace
        run: git diff --check
